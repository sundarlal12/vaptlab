    <!-- Fallback tags for crawlers that don't execute JavaScript. react-helmet-async
         overrides title/description/canonical/OG/Twitter per route once the app mounts. -->
    <title>VAPT — AI-Powered Penetration Testing, Delivered in Hours | VAPTlabs</title>
    <meta name="description" content="VAPTlabs delivers AI-powered VAPT (vulnerability assessment & penetration testing), so you get an audit-ready report for SOC 2, ISO 27001, HIPAA or PCI-DSS in hours. Serving clients across the US, UAE, Saudi Arabia, Singapore, Europe and Australia." />
    <meta name="keywords" content="VAPT, AI VAPT, GenAI VAPT, automated penetration testing, ethical hacking, vulnerability assessment, automated pentest, red teaming, SOC 2 audit, ISO 27001 audit, HIPAA penetration testing, VAPT services USA, VAPT company UAE, penetration testing Singapore, VAPT Saudi Arabia" />
    <!-- robots and canonical are intentionally NOT hardcoded here: react-helmet-async
         appends per-route tags to <head> rather than replacing static ones, so a static
         canonical/robots here would sit alongside the per-page one instead of being
         overridden - two conflicting canonicals is exactly the bug this file used to have.
         Non-JS crawlers get an implicit self-referencing canonical and "index,follow" by
         default in the absence of these tags, which is the correct behavior anyway. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VAPTlabs" />
    <meta property="og:title" content="VAPT — AI-Powered Penetration Testing, Delivered in Hours | VAPTlabs" />

    <meta property="og:image:alt" content="VAPTlabs — AI-powered penetration testing" />
